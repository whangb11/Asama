<title>四棱锥旋转动画 · 序列帧导出</title>
<style>
  html, body {
    margin: 0;
    padding: 0;
    width: 100%;
    height: 100%;
    background: #000000;          /* 纯黑背景 */
    overflow: hidden;

    display: block;

  }

  /* ---------- 底部导出按钮 ---------- */
  #exportBtn {
    position: fixed;
    left: 50%;
    bottom: 26px;
    transform: translateX(-50%);
    padding: 12px 28px;
    border-radius: 999px;
    border: 1px solid rgba(255, 255, 255, 0.22);
    background: rgba(255, 255, 255, 0.07);

    -webkit-backdrop-filter: blur(8px);

  #exportBtn:hover:not(:disabled) {

  #exportBtn:active:not(:disabled) {

  }

<body>
<canvas id="canvas"></canvas>
<button id="exportBtn">导出完整旋转序列帧到剪贴板</button>

<script>
(function () {
  'use strict';

  /* ================================================================
   *  0. 公共几何 / 相机常量
   * ================================================================ */
  const FRAME_RATE = 15.0
  const CAM_Z     = 5.0;              // 相机位于 (0,0,CAM_Z)，平视 -z
  const FOCAL     = 4.5;              // 透视焦距
  const HALF_S    = 1.0;              // 底面半边长
  const HEIGHT    = 1.8;              // 四棱锥高度
  const ROT_SPEED = Math.PI * 1.0;    // 角速度：每秒 90°（一圈 4 秒）
  const FRAME_MS  = 1000 / FRAME_RATE;        // 60fps 固定步长

  const yTop =  HEIGHT / 2;
  const yBot = -HEIGHT / 2;

  /* 模型坐标系下的顶点 */
  const apex = [ 0,      yTop,  0     ];  // 顶点
  const A    = [ HALF_S, yBot,  HALF_S];  // +x +z
  const B    = [ HALF_S, yBot, -HALF_S];  // +x -z
  const C    = [-HALF_S, yBot, -HALF_S];  // -x -z
  const D    = [-HALF_S, yBot,  HALF_S];  // -x +z

  /* 四个侧面（顶点顺序保证法线朝外），颜色按要求指定 */
  const FACES = [
    { v: [apex, A, B], color: '#ff0000' }, // +x 方向：0xff0000
    { v: [apex, D, A], color: '#00ff00' }, // +z 方向：0x00ff00
    { v: [apex, C, D], color: '#0000ff' }, // -x 方向：0x0000ff
    { v: [apex, B, C], color: '#ffff00' }  // -z 方向：0xffff00
  ];

  /* ================================================================
   *  1. 屏幕画布：主视图
   * ================================================================ */
  const canvas = document.getElementById('canvas');
  const ctx = canvas.getContext('2d');

  let W = 0, H = 0, cx = 0, cy = 0, viewScale = 1;

  function resize() {
    const dpr = window.devicePixelRatio || 1;
    W = window.innerWidth;
    H = window.innerHeight;

    canvas.width  = Math.max(1, Math.floor(W * dpr));
    canvas.height = Math.max(1, Math.floor(H * dpr));
    canvas.style.width  = W + 'px';
    canvas.style.height = H + 'px';

    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);   // 后续统一使用 CSS 像素

    cx = W / 2;
    cy = H / 2;
    viewScale = Math.min(W, H) * 0.34;        // 世界单位 → 像素

    render();
  }

  /* ---------------- 数学工具 ---------------- */

  // 绕 y 轴（竖直向上轴）旋转
  function rotateY(p, cosA, sinA) {
    return [
       p[0] * cosA + p[2] * sinA,
       p[1],
      -p[0] * sinA + p[2] * cosA
    ];
  }

  // 主视图透视投影
  function project(p) {
    const k = FOCAL / (CAM_Z - p[2]);
    return [
      cx + p[0] * k * viewScale,
      cy - p[1] * k * viewScale
    ];
  }

  // 计算面法线（未归一化，只用于判断朝向）
  function faceNormal(q0, q1, q2) {
    const ax = q1[0] - q0[0], ay = q1[1] - q0[1], az = q1[2] - q0[2];
    const bx = q2[0] - q0[0], by = q2[1] - q0[1], bz = q2[2] - q0[2];
    return [
      ay * bz - az * by,
      az * bx - ax * bz,
      ax * by - ay * bx
    ];
  }

  // 该面是否朝向相机（背面剔除）
  function isFacingCamera(q0, n) {
    const vx = 0 - q0[0];
    const vy = 0 - q0[1];
    const vz = CAM_Z - q0[2];
    return (n[0] * vx + n[1] * vy + n[2] * vz) > 0;
  }

  /* ---------------- 主渲染 ---------------- */
  let angle = 0;

  function render() {
    // 纯黑背景
    ctx.fillStyle = '#000000';
    ctx.fillRect(0, 0, W, H);

    const cosA = Math.cos(angle);
    const sinA = Math.sin(angle);

    const visible = [];

    for (let i = 0; i < FACES.length; i++) {
      const f  = FACES[i];
      const q0 = rotateY(f.v[0], cosA, sinA);
      const q1 = rotateY(f.v[1], cosA, sinA);
      const q2 = rotateY(f.v[2], cosA, sinA);

      const n = faceNormal(q0, q1, q2);
      if (!isFacingCamera(q0, n)) continue;   // 剔除背面

      visible.push({
        q: [q0, q1, q2],
        color: f.color,
        depth: (q0[2] + q1[2] + q2[2]) / 3
      });
    }

    // 凸体经背面剔除后基本无重叠，这里仅作保险排序
    visible.sort((a, b) => a.depth - b.depth);

    ctx.lineJoin = 'round';
    ctx.lineWidth = 1;

    for (let i = 0; i < visible.length; i++) {
      const item = visible[i];
      const p0 = project(item.q[0]);
      const p1 = project(item.q[1]);
      const p2 = project(item.q[2]);

      ctx.beginPath();
      ctx.moveTo(p0[0], p0[1]);
      ctx.lineTo(p1[0], p1[1]);
      ctx.lineTo(p2[0], p2[1]);
      ctx.closePath();

      // 纯色填充，不考虑光照
      ctx.fillStyle = item.color;
      ctx.fill();
      // 同色描边消除抗锯齿细缝
      ctx.strokeStyle = item.color;
      ctx.stroke();
    }
  }

  /* ---------------- 60fps 主循环 ---------------- */
  let acc  = 0;
  let prev = performance.now();

  function loop(now) {
    requestAnimationFrame(loop);

    let dt = now - prev;
    prev = now;
    if (dt > 250) dt = 250;   // 切回标签页时避免角度突跳

    acc += dt;

    let stepped = false;
    while (acc >= FRAME_MS) {          // 固定步长推进，保证 60fps 节奏
      angle += ROT_SPEED * (FRAME_MS / 1000);
      acc -= FRAME_MS;
      stepped = true;
    }

    if (angle >= Math.PI * 2) angle -= Math.PI * 2;
    if (angle < 0)            angle += Math.PI * 2;

    if (stepped) render();
  }

  /* ================================================================
   *  2. 序列帧导出（32×32 / 每行 32 帧 / SVG）
   * ================================================================ */
  const FRAME_SIZE  = 32;      // 单帧边长（px）
  const FRAME_HALF  = 16;      // 单帧中心
  const FRAME_SCALE = 11.5;    // 单帧内的世界单位 → 像素比例（保证恰好放入 32×32）
  const COLS        = 32;      // 每行帧数

  // 单帧内的透视投影
  function projectFrame(p) {
    const k = FOCAL / (CAM_Z - p[2]);
    return [
      FRAME_HALF + p[0] * k * FRAME_SCALE,
      FRAME_HALF - p[1] * k * FRAME_SCALE
    ];
  }

  function fmtPoint(p) {
    return p[0].toFixed(2) + ',' + p[1].toFixed(2);
  }

  // 生成某一角度下、32×32 视口内的面片 SVG 片段
  function frameContent(a) {
    const cosA = Math.cos(a);
    const sinA = Math.sin(a);
    let out = '';

    for (let i = 0; i < FACES.length; i++) {
      const f  = FACES[i];
      const q0 = rotateY(f.v[0], cosA, sinA);
      const q1 = rotateY(f.v[1], cosA, sinA);
      const q2 = rotateY(f.v[2], cosA, sinA);

      const n = faceNormal(q0, q1, q2);
      if (!isFacingCamera(q0, n)) continue;   // 背面剔除

      const p0 = projectFrame(q0);
      const p1 = projectFrame(q1);
      const p2 = projectFrame(q2);

      out +=
        '<polygon points="' +
          fmtPoint(p0) + ' ' + fmtPoint(p1) + ' ' + fmtPoint(p2) +
        '" fill="' + f.color + '" stroke="' + f.color +
        '" stroke-width="0.5" stroke-linejoin="round"/>';
    }
    return out;
  }

  // 组装整张 SVG 图集
  function buildSpriteSheetSVG() {
    // 一圈需要的时间（秒） × 60fps = 总帧数（当前参数下为 4 × 60 = 240 帧）
    const total = Math.round(FRAME_RATE * (2 * Math.PI / ROT_SPEED));
    const rows  = Math.ceil(total / COLS);
    const sheetW = COLS * FRAME_SIZE;
    const sheetH = rows * FRAME_SIZE;

    const parts = [];
    parts.push(
      '<svg xmlns="http://www.w3.org/2000/svg" ' +
      'width="' + sheetW + '" height="' + sheetH + '" ' +
      'viewBox="0 0 ' + sheetW + ' ' + sheetH + '">'
    );
    // parts.push('<rect width="' + sheetW + '" height="' + sheetH + '" fill="#000000"/>');

    for (let i = 0; i < total; i++) {
      const a   = (i / total) * Math.PI * 2;   // 均匀覆盖 0 ~ 2π，首尾不重复
      const col = i % COLS;
      const row = Math.floor(i / COLS);

      const content = frameContent(a);
      if (!content) continue;

      parts.push(
        '<g transform="translate(' + (col * FRAME_SIZE) + ',' + (row * FRAME_SIZE) + ')">' +
          content +
        '</g>'
      );
    }

    parts.push('</svg>');

    return {
      svg:    parts.join(''),
      frames: total,
      width:  sheetW,
      height: sheetH,
      rows:   rows
    };
  }

  /* ---------------- 剪贴板写入（含降级方案） ---------------- */
  async function copyTextToClipboard(text) {
    // 首选异步 Clipboard API
    try {
      if (navigator.clipboard && window.isSecureContext) {
        await navigator.clipboard.writeText(text);
        return true;
      }
    } catch (err) {
      /* 落到下面的降级方案 */
    }

    // 降级：隐藏 textarea + execCommand
    const ta = document.createElement('textarea');
    ta.value = text;
    ta.setAttribute('readonly', '');
    ta.style.position = 'fixed';
    ta.style.top = '0';
    ta.style.left = '0';
    ta.style.width = '1px';
    ta.style.height = '1px';
    ta.style.padding = '0';
    ta.style.border = 'none';
    ta.style.outline = 'none';
    ta.style.boxShadow = 'none';
    ta.style.background = 'transparent';
    ta.style.opacity = '0';

    document.body.appendChild(ta);
    ta.focus();
    ta.select();
    ta.setSelectionRange(0, text.length);

    let ok = false;
    try {
      ok = document.execCommand('copy');
    } catch (err) {
      ok = false;
    }
    document.body.removeChild(ta);

    return ok;
  }

  /* ---------------- 按钮交互 ---------------- */
  const btn = document.getElementById('exportBtn');
  const btnLabel = btn.textContent;
  let busy = false;

  btn.addEventListener('click', function () {
    if (busy) return;
    busy = true;
    btn.disabled = true;
    btn.textContent = '正在生成序列帧…';

    // 让浏览器先完成一次界面刷新，再执行耗时任务
    requestAnimationFrame(function () {
      setTimeout(async function () {
        try {
          const sheet = buildSpriteSheetSVG();
          console.log(
            '[导出] 帧数:', sheet.frames,
            '| 尺寸:', sheet.width + '×' + sheet.height,
            '| 字符数:', sheet.svg.length
          );

          const ok = await copyTextToClipboard(sheet.svg);

          if (ok) {
            btn.textContent =
              '已复制 ' + sheet.frames + ' 帧 · ' +
              sheet.width + '×' + sheet.height + ' SVG';
          } else {
            btn.textContent = '复制失败，请检查浏览器权限';
          }
        } catch (err) {
          console.error(err);
          btn.textContent = '生成失败，请查看控制台';
        }

        // 2 秒后恢复按钮
        setTimeout(function () {
          btn.textContent = btnLabel;
          btn.disabled = false;
          busy = false;
        }, 2000);
      }, 0);
    });
  });

  /* ================================================================
   *  3. 启动
   * ================================================================ */
  window.addEventListener('resize', resize);
  resize();                              // 初始化尺寸并先绘制一帧
  requestAnimationFrame(loop);
})();
</script>
</body>
